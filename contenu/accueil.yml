editoTitre: "qui somme nous ? "
edito: "Rvptvre est un média indépendant qui fait se rencontrer deux mondes que
  tout semble opposer : la rigueur du droit et la liberté de l'art. Ici, on
  décrypte l'actualité juridique, on raconte celles et ceux qui la font, et on
  arpente les défilés, les salles obscures et les galeries."
heroItalique: Le droit, l'art
heroCapitales: et tout ce qui fait rvptvre
heroTexte: "Analyses, portraits, critiques et coups de cœur : un regard neuf sur
  ce qui bouge dans les prétoires comme sur les scènes."
uneTexte: Les derniers articles publiés, toutes rubriques confondues.
aPropos: "Rvptvre est un média né d’une conviction simple : le droit et l’art
  coexistent dans bien plus de domaines qu’on ne le pense."
aProposItalique: >
  Nous explorons de nouvelles perspectives, en rendant le droit accessible et en
  valorisant la diversité des expressions artistiques et des sujets de société
  qui nous animent.
motEntoure: expressions
globeTexte: "RVPTVRE · DROIT & ART · "
valeurs:
  - titre: Curiosité.
    texte: Des tribunaux aux ateliers, nous allons chercher les histoires là où on
      ne les attend pas.
  - titre: Clarté.
    texte: Rendre lisible ce qui est complexe, sans jamais simplifier à l'excès.
      Écrire pour être compris.
  - titre: Indépendance.
    texte: Un regard libre, critique et sincère avant tout.
  - titre: "Pluralité. "
    texte: >
      Pluralité des idées, des perspectives, des sensibilités, mais avant tout
      des domaines. Parce qu’aucun sujet ne devrait être considéré comme moins
      digne d’intérêt qu’un autre, penser qu’une thématique mérite davantage
      d’attention, c’est oublier la richesse de ce que chacune peut nous
      apporter.
